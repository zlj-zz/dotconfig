# -- copy mode -----------------------------------------------------------------

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line

# panes
#setw -g pane-border-status bottom
setw -g pane-border-format '#[bold]#{?#{&&:#{pane_active},#{client_prefix}},#[underscore],}\
#{?pane_active,❐ #S:#I/#{session_windows} ,}#{?window_zoomed_flag,⬢,❄} #P ⇒ #{pane_tty} #{pane_current_command}'
#set -g pane-active-border-style fg=brightblue
#set -g pane-border-style fg=magenta

# windows / status — Catppuccin Frappé
set-option -g status on
set-option -g status-interval 10

set -g @catppuccin_flavor "frappe"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_flags "icon"
# show window name (#W), not pane title (#T) from Claude/Cursor
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
# directory: ~ + last 2 segments when deep, capped length (see scripts/status-path.sh)
set -g @catppuccin_directory_text " #(~/.config/tmux/scripts/status-path.sh #{q:pane_current_path})"
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

set -g status-left-length 100
set -g status-right-length 100
# PREFIX pill: avoid commas inside #{?,,} branches (they split the format).
# Use separate #[...] attrs + #, if a single [] needs multiple attrs.
set -g status-left "#{?client_prefix,#[fg=#ef9f76]#[fg=#232634]#[bg=#ef9f76]#[bold] PREFIX #[nobold]#[fg=#ef9f76]#[bg=default] ,}#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_directory}"

# extrakto: fuzzy-pick words/paths/URLs from pane (default Tab conflicts with last-window)
set -g @extrakto_key "g"
run-shell ~/.config/tmux/extrakto/extrakto.tmux
#run-shell ~/.config/tmux/for-mac.sh

