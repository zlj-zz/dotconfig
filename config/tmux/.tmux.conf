#
# tmux is a terminal multiplexer


# -- general -------------------------------------------------------------------

# Ghostty / modern terminals: prefer tmux-256color over screen-256color
set -g default-terminal "tmux-256color"
set -gas terminal-overrides ',xterm*:RGB:sitm=\E[3m'
set -gas terminal-overrides ',xterm*:Tc'
setw -g xterm-keys on
# Claude Code / modern CLIs: distinguish Shift+Enter from Enter inside tmux
set -g allow-passthrough on
set -s extended-keys always
set -as terminal-features 'xterm*:RGB:extkeys'
set -as terminal-features 'xterm-ghostty:RGB:extkeys'
set -s escape-time 0
set -sg repeat-time 300
set -s focus-events on
set -g mouse on
set -sg exit-empty on

set -g visual-activity off
setw -g monitor-activity off
setw -g monitor-bell off

set -g history-limit 50000
set -g set-clipboard on

# -- basic key map ------------------------------------------------------------

set -g prefix2 C-x                        # GNU-Screen compatible prefix
bind C-x send-prefix -2

set -q -g status-utf8 on                  # expect UTF-8 (tmux < 2.2)
setw -q -g utf8 on

# edit configuration
bind e new-window -n "~/.tmux.conf" "sh -c '\${EDITOR:-vim} ~/.tmux.conf && tmux source ~/.tmux.conf && tmux display \"*/.tmux.conf sourced\"'"

# reload configuration
bind r source-file ~/.tmux.conf \; display '*/.tmux.conf sourced'

# -- toggle_status (Shift+S; keep plain "s" for choose-session)
bind s choose-tree -Zs
bind S if-shell '[[ $(tmux show -g status | cut -d\  -f2) == "on" ]]' \
'set -g status off' \
'set -g status on'

# -- app ------------------------------

# yazi file manager (Prefix Y; avoid clobbering native "!")
unbind @
bind ! break-pane
bind Y split-window -c "#{pane_current_path}" yazi

# -- display -------------------------------------------------------------------

set -g base-index 1           # start windows numbering at 1
setw -g pane-base-index 1     # make pane numbering consistent with windows

setw -g automatic-rename off   # don't rename from running process
setw -g allow-rename off       # don't allow apps to rename via escape sequences
set -g renumber-windows on    # renumber windows when a window is closed

set -g set-titles on          # set terminal title

set -g display-panes-time 800 # slightly longer pane indicators display time
set -g display-time 1000      # slightly longer status messages display time

set -g status-interval 10     # redraw status line every 10 seconds

# clear both screen and history
bind -n C-l send-keys C-l \; run 'sleep 0.1' \; clear-history

# activity
set -g monitor-activity on
set -g visual-activity off

# pane border
#set-option -g pane-border-style fg=colour235 #fg=base02
#set-option -g pane-active-border-style fg=colour240 #fg=base01

# -- navigation ----------------------------------------------------------------
# $：重命名当前会话
# 启动命名tmux              tmux new -s <name>
# 分离会话                  tmux detach
# 重接会话                  tmux attach -t <name>
# 杀死会话        j          tmux kill-session -t <name>
# 切换会话                  tmux switch -t <name>

# 列出所有快捷键，及其对应的 Tmux 命令           tmux list-keys
# 列出所有 Tmux 命令及其参数                     tmux list-commands
# 列出当前所有 Tmux 会话的信息                   tmux info

# create session
bind C-c new-session

# find session
bind C-f command-prompt -p "find session:" {switch-client -t '%%'}

# kill seesion
bind C-d command-prompt -p "kill session:" {kill-session -t '%%'}

# split: "-" = top/bottom, "|" = left/right (restore "=" for choose-buffer)
bind = choose-buffer -Z
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

# join existing window/pane into current (choose-tree preview, like Prefix w)
# paired with Prefix ! (break-pane): ! = split out, @ = join in
# note: Prefix J is already resize-pane, so use @
bind @ choose-tree -Z "join-pane -h -s '%%'"

# pane navigation
bind -r h select-pane -L  # move left
bind -r j select-pane -D  # move down
bind -r k select-pane -U  # move up
bind -r l select-pane -R  # move right
bind > swap-pane -D       # swap current pane with the next one
bind < swap-pane -U       # swap current pane with the previous one
# q 显示窗格的编号（和尺寸），此时可通过按下数字切换（使用后面的主题后数字切换失效）
# o：交换窗格（将输入切换到下一个窗格）
# z：zoom / unzoom current pane（原生）
unbind +

# pane resizing
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# window navigation
# c：新建窗口
# 0~9 选择几号窗口
# w：列出所有窗口，此时可通过方向键和回车键切换
# n：切换到后一个窗口（使用后面的主题后失效）
# p：切换到前一个窗口（使用后面的主题后失效）
# ,：重命名当前窗口（不知是否可以在创建时就命名）
# &：关闭当前窗口。
bind c command-prompt -p "window name:" "new-window -n '%%' -c '#{pane_current_path}'"
# move current window to index with shift (not swap); see scripts/move-window.sh
bind . command-prompt -p "move window to index:" -I "#{window_index}" "run-shell -b '~/.config/tmux/scripts/move-window.sh %% #{window_index}'"
bind Tab last-window        # move to last active window

# toggle mouse
unbind m
bind m set -g mouse \; display-message 'mouse #{?mouse,on,off}'

# Ctrl + b  再按  d 临时退出,下次用 tmux a 或 tmux attach 连回去
# Ctrl + b  再按  & 彻底关闭

# 操作场景	快捷键 / 命令	说明
# 进入复制模式	Ctrl + b → [	进入后可上下翻滚历史
# 退出复制模式	q 或 Esc	回到正常命令行模式
# 逐行滚动	方向键 ↑/↓ 或 k/j	精细定位
# 整屏翻页	PageUp / PageDown	快速跳转
# 半屏滚动	Ctrl + u（上）/ Ctrl + d（下）	高效翻页
# 搜索关键词	进入复制模式后，按 /（向下）或 ?（向上）	查找错误或关键日志
# 下一个匹配项	n / N	跳转下一个 / 上一个搜索结果

# 1. 适合快速复制一段日志。
# 2. 进入复制模式：Ctrl + b → [
# 3. 移动光标到复制起始位置
# 4. 按 Space 开始选中内容
# 5. 移动光标到结束位置，按 Enter 完成复制
# 6. 粘贴到当前 Pane：Ctrl + b → ]

